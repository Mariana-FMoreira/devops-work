name: CI e Deploy

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    name: Build com Maven
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven
      - name: Build com Maven
        run: mvn -B package --file pom.xml

  delivery:
    name: Delivery (dry run)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - name: Build and test with Maven
        run: mvn clean install
      - name: Check deploy step (dry run)
        run: echo "Simulando deploy (dry run). Nenhum deploy será feito."

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven
      - name: Build JAR
        run: mvn -B package --file pom.xml
      - name: Build Docker image
        run: docker build -t devops-app:latest .

  discord:
    runs-on: ubuntu-latest
    needs: [build, delivery, docker]
    steps:
      - uses: actions/checkout@v4
      - name: Discord notification
        uses: Ilshidur/action-discord@master
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        with:  
          args: "[PULL REQUEST] - PR Validada com sucesso"